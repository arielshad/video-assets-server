apiVersion: v1
kind: Service
metadata:
  name: video-assets-server
  namespace: video-assets-server
  labels:
    app: video-assets-server
spec:
  selector:
    app: video-assets-server
  ports:
    - name: http
      port: 80
      targetPort: http
    # Scraped by the ServiceMonitor; the Ingress only routes port 80.
    - name: metrics
      port: 9464
      targetPort: metrics
