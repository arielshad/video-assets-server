# Ingress for video.shep.bot. DNS is the *.shep.bot wildcard; TLS terminates at
# the edge Caddy, which issues the cert on demand because this Ingress declares
# the host (shep-infra: infra/edge-tls-ask) and forwards plain HTTP here.
#
# No video streams through here (downloads are 302 redirects to the sources),
# so nginx keeps its default buffering. The read timeout covers the slowest
# response we do serve: a b-roll sequence plan (POST /v1/sequences), which
# searches every source once per shot.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-assets-server
  namespace: video-assets-server
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: video.shep.bot
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: video-assets-server
                port:
                  number: 80
