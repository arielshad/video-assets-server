<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">No video passes through the server</title>
  <desc id="d">Your browser, curl or AI assistant asks video-assets-server to search, describe or plan, and the server asks the sources' APIs for metadata only. Playback goes straight from the source's CDN to your browser. A download is a 302 redirect to the source file, with the licence and credit line in x-license and x-attribution headers.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#c4b5fd"/>
    </marker>
    <marker id="vid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6ee7b7"/>
    </marker>
    <marker id="redir" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fcd9a0"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .card { fill: #1d1a2b; stroke: #36314c; }
    .h { fill: #f0eef7; font-size: 16px; font-weight: 700; }
    .sub { fill: #a29eb6; font-size: 12.5px; }
    .meta { stroke: #c4b5fd; stroke-width: 1.8; fill: none; }
    .video { stroke: #6ee7b7; stroke-width: 4; fill: none; }
    .redir { stroke: #fcd9a0; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
    .lm { fill: #e4ddff; font-size: 13px; }
    .lv { fill: #a7f3d0; font-size: 13px; }
    .lr { fill: #fcd9a0; font-size: 13px; }
  </style>
  <rect width="960" height="330" rx="18" fill="#13111c"/>
  <rect x="0.5" y="0.5" width="959" height="329" rx="17.5" fill="none" stroke="#2a2638"/>

  <text class="h" x="30" y="40">No video passes through the server</text>

  <!-- nodes -->
  <g text-anchor="middle">
    <rect class="card" x="30" y="110" width="200" height="110" rx="14"/>
    <text class="h" x="130" y="152">You</text>
    <text class="sub" x="130" y="174">browser, curl,</text>
    <text class="sub" x="130" y="192">or your AI assistant</text>

    <rect x="380" y="70" width="200" height="90" rx="14" fill="#1d1a2b" stroke="#8b6cf6" stroke-opacity="0.8"/>
    <text class="h" x="480" y="106" fill="#c4b5fd">video-assets-server</text>
    <text class="sub" x="480" y="128">searches, describes, plans</text>
    <text class="sub" x="480" y="146">metadata only</text>

    <rect x="730" y="110" width="200" height="110" rx="14" fill="#1d1a2b" stroke="#34d399" stroke-opacity="0.6"/>
    <text class="h" x="830" y="152">Source CDNs</text>
    <text class="sub" x="830" y="174">NASA, Wikimedia,</text>
    <text class="sub" x="830" y="192">Internet Archive</text>
  </g>

  <!-- metadata -->
  <path class="meta" d="M230 135C300 135 320 115 376 115" marker-end="url(#arr)"/>
  <text class="lm" x="300" y="98" text-anchor="middle">search, details, plans</text>
  <path class="meta" d="M584 115C640 115 670 135 726 135" marker-end="url(#arr)"/>
  <text class="lm" x="664" y="98" text-anchor="middle">asks their APIs</text>

  <!-- video bytes -->
  <path class="video" d="M726 250H236" marker-end="url(#vid)"/>
  <text class="lv" x="480" y="240" text-anchor="middle">playback and downloads: straight from the source's CDN</text>

  <!-- downloads -->
  <text class="lr mono" x="480" y="290" text-anchor="middle">GET /v1/clips/:id/download → 302 to the source file</text>
  <text class="sub" x="480" y="310" text-anchor="middle">with the licence and credit line in x-license and x-attribution headers</text>
</svg>
