<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="t d">
  <title id="t">What build_sequence gives you</title>
  <desc id="d">An example 20-second vertical sequence with four 5-second shots: a drone shot of a coastline, waves at sunset, plastic on a beach and volunteers cleaning a beach, each with its source, licence and verdict. It is exported as timeline.otio (DaVinci Resolve, Kdenlive; Premiere and FCP via OTIO), concat.sh (ffmpeg trims, crops to 9:16 and joins the shots), remotion.json (a clip list for Remotion), and ATTRIBUTION.md and credits.json.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e5f8c"/><stop offset="1" stop-color="#3fa3c4"/></linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d4aa8"/><stop offset="0.6" stop-color="#f08a6c"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8cf98"/><stop offset="1" stop-color="#cfae6f"/></linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ef"/><stop offset="0.6" stop-color="#cdeefa"/></linearGradient>
    <clipPath id="c0"><rect x="42" y="96" width="201" height="62" rx="7"/></clipPath><clipPath id="c1"><rect x="267" y="96" width="201" height="62" rx="7"/></clipPath><clipPath id="c2"><rect x="492" y="96" width="201" height="62" rx="7"/></clipPath><clipPath id="c3"><rect x="717" y="96" width="201" height="62" rx="7"/></clipPath>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a85a3"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { fill: #f0eef7; font-size: 16px; font-weight: 700; }
    .sub { fill: #a29eb6; font-size: 13px; }
    .tick { fill: #8a85a3; font-size: 12px; }
    .shot { fill: #f0eef7; font-size: 13.5px; font-weight: 600; }
    .src { fill: #a29eb6; font-size: 12px; }
    .file { fill: #6ee7b7; font-size: 14px; font-weight: 600; }
    .why { fill: #b3afc6; font-size: 13px; }
    .yes { fill: #34d399; fill-opacity: 0.16; stroke: #34d399; stroke-opacity: 0.6; }
    .credit { fill: #4cc9e6; fill-opacity: 0.14; stroke: #4cc9e6; stroke-opacity: 0.6; }
    .badge { font-size: 11.5px; }
  </style>
  <rect width="960" height="410" rx="18" fill="#13111c"/>
  <rect x="0.5" y="0.5" width="959" height="409" rx="17.5" fill="none" stroke="#2a2638"/>

  <text class="h" x="30" y="36">ocean-cleanup · 9:16 · 20 s</text>
  <text class="sub" x="262" y="36">one clip per shot, 3 alternatives each (example)</text>
  <path d="M30 78H930" stroke="#3d3855"/>
  <path d="M30 74v8" stroke="#5b5672"/><text class="tick" x="30" y="68" text-anchor="start">0 s</text><path d="M255 74v8" stroke="#5b5672"/><text class="tick" x="255" y="68" text-anchor="middle">5 s</text><path d="M480 74v8" stroke="#5b5672"/><text class="tick" x="480" y="68" text-anchor="middle">10 s</text><path d="M705 74v8" stroke="#5b5672"/><text class="tick" x="705" y="68" text-anchor="middle">15 s</text><path d="M930 74v8" stroke="#5b5672"/><text class="tick" x="930" y="68" text-anchor="end">20 s</text>

