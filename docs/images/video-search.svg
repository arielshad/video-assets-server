<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Video-aware search</title>
  <desc id="d">The query "4k vertical drone ocean 10s" becomes filters: minimum resolution 2160 on the short side, portrait orientation, the text "drone ocean" sent to every site, the categories nature.ocean and aerial, and a minimum length of 10 seconds. Every result comes back labelled with category, resolution, frame rate, length, audio and a licence verdict.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8a85a3"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { fill: #f0eef7; font-size: 16px; font-weight: 700; }
    .sub { fill: #a29eb6; font-size: 13px; }
    .lbl { font-size: 14.5px; font-weight: 700; }
    .tag { fill: #d9d6e8; font-size: 13px; }
  </style>
  <rect width="960" height="330" rx="18" fill="#13111c"/>
  <rect x="0.5" y="0.5" width="959" height="329" rx="17.5" fill="none" stroke="#2a2638"/>

  <text class="h" x="30" y="40">Type it the way an editor would say it</text>

  <!-- search box -->
  <rect x="30" y="56" width="900" height="54" rx="14" fill="#1d1a2b" stroke="#8b6cf6" stroke-opacity="0.7"/>
  <circle cx="60" cy="81" r="8" stroke="#a29eb6" stroke-width="2.2" fill="none"/>
  <path d="M66 87l6 6" stroke="#a29eb6" stroke-width="2.2" stroke-linecap="round"/>
  <text class="mono" x="88" y="90" font-size="20" font-weight="600" xml:space="preserve"><tspan fill="#c4b5fd">4k</tspan> <tspan fill="#f9a8d4">vertical</tspan> <tspan fill="#7fdcf0">drone ocean</tspan> <tspan fill="#6ee7b7">10s</tspan></text>

  <path d="M480 116v20" stroke="#8a85a3" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- filters -->
  <g>
    <rect x="30" y="144" width="168" height="88" rx="12" fill="#8b6cf6" fill-opacity="0.08" stroke="#8b6cf6" stroke-opacity="0.5"/>
    <text class="lbl mono" x="46" y="173" fill="#c4b5fd">≥ 2160</text>
    <text class="sub" x="46" y="197">4K, measured on</text>
    <text class="sub" x="46" y="215">the short side</text>

    <rect x="213" y="144" width="168" height="88" rx="12" fill="#f472b6" fill-opacity="0.07" stroke="#f472b6" stroke-opacity="0.5"/>
    <text class="lbl mono" x="229" y="173" fill="#f9a8d4">portrait</text>
    <text class="sub" x="229" y="197">9:16, for Reels,</text>
    <text class="sub" x="229" y="215">Shorts and TikTok</text>

    <rect x="396" y="144" width="168" height="88" rx="12" fill="#4cc9e6" fill-opacity="0.07" stroke="#4cc9e6" stroke-opacity="0.5"/>
    <text class="lbl mono" x="412" y="173" fill="#7fdcf0">"drone ocean"</text>
    <text class="sub" x="412" y="197">sent to every site</text>
    <text class="sub" x="412" y="215">at once</text>

    <rect x="579" y="144" width="168" height="88" rx="12" fill="#f5b85b" fill-opacity="0.07" stroke="#f5b85b" stroke-opacity="0.5"/>
    <text class="lbl mono" x="595" y="173" fill="#fcd9a0">nature.ocean</text>
    <text class="lbl mono" x="595" y="193" fill="#fcd9a0">aerial</text>
    <text class="sub" x="595" y="215">from "drone", "ocean"</text>

    <rect x="762" y="144" width="168" height="88" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.5"/>
    <text class="lbl mono" x="778" y="173" fill="#6ee7b7">≥ 10 s</text>
    <text class="sub" x="778" y="197">long enough</text>
    <text class="sub" x="778" y="215">to cut from</text>
  </g>

  <!-- labelled result -->
  <text class="sub" x="30" y="270">Every result comes back labelled</text>
  <g transform="translate(250 252)">
    <rect width="114" height="28" rx="14" fill="#1f1c2e" stroke="#3a3552"/><text class="tag mono" x="57" y="19" text-anchor="middle">nature.ocean</text>
    <rect x="124" width="96" height="28" rx="14" fill="#1f1c2e" stroke="#3a3552"/><text class="tag" x="172" y="19" text-anchor="middle">2160×3840</text>
    <rect x="230" width="66" height="28" rx="14" fill="#1f1c2e" stroke="#3a3552"/><text class="tag" x="263" y="19" text-anchor="middle">30 fps</text>
    <rect x="306" width="56" height="28" rx="14" fill="#1f1c2e" stroke="#3a3552"/><text class="tag" x="334" y="19" text-anchor="middle">14 s</text>
    <rect x="372" width="84" height="28" rx="14" fill="#1f1c2e" stroke="#3a3552"/><text class="tag" x="414" y="19" text-anchor="middle">no audio</text>
    <rect x="466" width="150" height="28" rx="14" fill="#4cc9e6" fill-opacity="0.14" stroke="#4cc9e6" stroke-opacity="0.6"/><text class="tag mono" x="541" y="19" text-anchor="middle" fill="#9be6f5">yes-with-credit</text>
  </g>
  <text class="sub" x="250" y="306">plus a credit line, an editorial flag when it applies, and a file that plays in the browser</text>
</svg>
