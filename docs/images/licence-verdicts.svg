<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d">
  <title id="t">Licence verdicts</title>
  <desc id="d">Every clip answers one question: can I use this commercially? yes: no conditions (CC0, public domain, US government works). yes-with-credit: credit the author (CC BY, NASA media). restricted: conditions that usually rule out normal use (CC BY-SA). check-terms: unknown or unverified. no: non-commercial only (CC BY-NC, CC BY-ND). Editorial is a separate flag for news, archive and NASA footage: fine for news, documentary and education, but in an ad it may imply endorsement. AI agents search commercial-safe clips by default.</desc>
  <defs>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.3" stop-color="#4cc9e6"/>
      <stop offset="0.55" stop-color="#f5b85b"/>
      <stop offset="0.8" stop-color="#8a85a3"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { fill: #f0eef7; font-size: 16px; font-weight: 700; }
    .sub { fill: #a29eb6; font-size: 13px; }
    .v { font-size: 12.5px; font-weight: 700; }
    .m { fill: #e2dff0; font-size: 13px; }
    .ex { fill: #8a85a3; font-size: 12px; }
  </style>
  <rect width="960" height="370" rx="18" fill="#13111c"/>
  <rect x="0.5" y="0.5" width="959" height="369" rx="17.5" fill="none" stroke="#2a2638"/>

  <text class="h" x="30" y="40">Every clip answers one question: can I put this in a paid project?</text>
  <rect x="30" y="56" width="900" height="6" rx="3" fill="url(#scale)"/>
  <text class="sub" x="30" y="82">use it</text>
  <text class="sub" x="930" y="82" text-anchor="end">keep it out of commercial work</text>

  <g>
    <rect x="30.0" y="96" width="172" height="150" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.55"/>
    <text class="v mono" x="44.0" y="122" fill="#6ee7b7">yes</text>
    <text class="m" x="44.0" y="150">No conditions</text>
    <text class="ex" x="44.0" y="194">CC0, public domain,</text>
    <text class="ex" x="44.0" y="212">US government works</text>
    <rect x="212.5" y="96" width="172" height="150" rx="12" fill="#4cc9e6" fill-opacity="0.07" stroke="#4cc9e6" stroke-opacity="0.55"/>
    <text class="v mono" x="226.5" y="122" fill="#7fdcf0">yes-with-credit</text>
    <text class="m" x="226.5" y="150">Credit the author</text>
    <text class="ex" x="226.5" y="194">CC BY, NASA media</text>
    <rect x="395.0" y="96" width="172" height="150" rx="12" fill="#f5b85b" fill-opacity="0.07" stroke="#f5b85b" stroke-opacity="0.55"/>
    <text class="v mono" x="409.0" y="122" fill="#fcd9a0">restricted</text>
    <text class="m" x="409.0" y="150">Conditions that rule</text>
    <text class="m" x="409.0" y="168">out normal use</text>
    <text class="ex" x="409.0" y="194">CC BY-SA: your video</text>
    <text class="ex" x="409.0" y="212">must be CC BY-SA too</text>
    <rect x="577.5" y="96" width="172" height="150" rx="12" fill="#8a85a3" fill-opacity="0.07" stroke="#8a85a3" stroke-opacity="0.55"/>
    <text class="v mono" x="591.5" y="122" fill="#c9c5da">check-terms</text>
    <text class="m" x="591.5" y="150">Unknown or</text>
    <text class="m" x="591.5" y="168">unverified</text>
    <text class="ex" x="591.5" y="194">no licence stated,</text>
    <text class="ex" x="591.5" y="212">uploader-asserted,</text>
    <text class="ex" x="591.5" y="230">third-party on NASA</text>
    <rect x="760.0" y="96" width="172" height="150" rx="12" fill="#f87171" fill-opacity="0.07" stroke="#f87171" stroke-opacity="0.55"/>
    <text class="v mono" x="774.0" y="122" fill="#fca5a5">no</text>
    <text class="m" x="774.0" y="150">Non-commercial</text>
    <text class="m" x="774.0" y="168">only</text>
    <text class="ex" x="774.0" y="194">CC BY-NC, BY-ND,</text>
    <text class="ex" x="774.0" y="212">personal use only</text>
  </g>

  <!-- editorial flag -->
  <rect x="30" y="262" width="900" height="58" rx="12" fill="#f472b6" fill-opacity="0.06" stroke="#f472b6" stroke-opacity="0.5"/>
  <rect x="46" y="279" width="84" height="24" rx="12" fill="#f472b6" fill-opacity="0.18"/>
  <text class="v mono" x="88" y="295.5" text-anchor="middle" fill="#fbcfe8">editorial</text>
  <text class="m" x="146" y="287">A separate flag: fine for news, documentary and education. In an ad it may imply</text>
  <text class="m" x="146" y="305">endorsement (NASA insignia, recognisable people, brands, archive newsreels).</text>

  <text class="sub" x="30" y="346">AI agents search <tspan fill="#6ee7b7">yes</tspan> and <tspan fill="#7fdcf0">yes-with-credit</tspan> by default. Downloads come with ATTRIBUTION.md and credits.json. A summary, not legal advice.</text>
</svg>
